display:
  - platform: st7735
    id: lcd

    model: INITR_BLACKTAB

    device_width: 128
    device_height: 128

    col_start: 0
    row_start: 0

    cs_pin: GPIO15
    dc_pin: GPIO7
    reset_pin: GPIO18

    rotation: 0

    lambda: |-
      it.fill(Color::BLACK);
      it.print(10, 10, id(font_small), Color::WHITE, "AIPI-HA");
