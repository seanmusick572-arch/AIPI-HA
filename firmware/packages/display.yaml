spi:
  clk_pin: GPIO16
  mosi_pin: GPIO17

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 22

display:
  - platform: mipi_spi
    id: lcd_display

    model: ST7735

    dc_pin: GPIO7
    cs_pin: GPIO15
    reset_pin: GPIO18

    dimensions:
      width: 128
      height: 128
      
    transform:
      swap_xy: true
      mirror_y: false
      mirror_x: false
      
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

lvgl:
   pages:
    - widgets:
        - obj:
            width: 128
            height: 128
            bg_color: white
            bg_opa: COVER
            widgets:
              - label:
                  align: CENTER
                  text: "Sean's Assistant"
                  text_color: black

switch:
  - platform: gpio
    id: lcd_backlight
    pin: GPIO3
    restore_mode: RESTORE_DEFAULT_ON
