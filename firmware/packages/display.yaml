spi:
  clk_pin: GPIO16
  mosi_pin: GPIO17

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 22

display:
  - platform: mipi_spi
    id: lcd_display

    model: ST7735

    dc_pin: GPIO7
    cs_pin: GPIO15
    reset_pin: GPIO18

    dimensions:
      width: 128
      height: 128

    rotation: 90
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

lvgl:
  widgets:
    - label:
        align: CENTER
        text: "AIPI-HA"
        text_font: font_small
        text_color: 0xFFFFFF

switch:
  - platform: gpio
    id: lcd_backlight
    pin: GPIO3
    restore_mode: RESTORE_DEFAULT_ON
